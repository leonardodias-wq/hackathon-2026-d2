<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reserva de Salas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="site-header">
        <h1>Reserva de Salas</h1>
        <p class="lede">
          Reserve salas em São Paulo, Araraquara e coworking sem conflito de
          horário — agenda do dia e formulário na mesma tela.
        </p>
      </header>

      <div class="layout">
        <section aria-labelledby="form-title">
          <h2 id="form-title">Nova reserva</h2>
          <form id="form-reserva" class="form-grid" novalidate>
            <label>
              Sala
              <select id="sala_id" name="sala_id" required></select>
            </label>
            <label>
              Título
              <input id="titulo" name="titulo" type="text" required maxlength="120" />
            </label>
            <label>
              Responsável
              <input id="responsavel_nome" name="responsavel_nome" type="text" required />
            </label>
            <label>
              E-mail
              <input
                id="responsavel_email"
                name="responsavel_email"
                type="email"
                required
              />
            </label>
            <label>
              Participantes
              <input
                id="participantes"
                name="participantes"
                type="number"
                min="1"
                value="1"
                required
              />
            </label>
            <label>
              Início
              <input id="inicio" name="inicio" type="datetime-local" required />
            </label>
            <label>
              Fim
              <input id="fim" name="fim" type="datetime-local" required />
            </label>
            <div class="actions">
              <button type="submit">Reservar</button>
            </div>
          </form>
          <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
        </section>

        <section aria-labelledby="agenda-title">
          <h2 id="agenda-title">Agenda do dia</h2>
          <div class="toolbar">
            <label>
              Data
              <input id="agenda-data" type="date" />
            </label>
            <button type="button" class="secondary" id="btn-atualizar">
              Atualizar
            </button>
          </div>
          <div id="agenda-empty" class="empty" hidden>
            Nenhuma reserva neste dia.
          </div>
          <div class="table-wrap">
            <table id="agenda-table" hidden>
              <thead>
                <tr>
                  <th scope="col">Sala</th>
                  <th scope="col">Horário</th>
                  <th scope="col">Título</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="agenda-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
