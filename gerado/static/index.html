<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Reserva de salas</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    section { margin-bottom: 2rem; }
    label { display: block; margin-top: 0.5rem; }
    input, select, button { margin-top: 0.25rem; padding: 0.4rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.4rem; text-align: left; }
  </style>
</head>
<body>
  <h1>Reserva de salas</h1>
  <section>
    <h2>Nova reserva</h2>
    <form id="form-reserva">
      <label>Sala <select id="sala_id" required></select></label>
      <label>Título <input id="titulo" required /></label>
      <label>Responsável <input id="responsavel_nome" required /></label>
      <label>E-mail <input id="responsavel_email" type="email" required /></label>
      <label>Participantes <input id="participantes" type="number" min="1" required /></label>
      <label>Início <input id="inicio" type="datetime-local" required /></label>
      <label>Fim <input id="fim" type="datetime-local" required /></label>
      <button type="submit">Reservar</button>
    </form>
    <p id="msg"></p>
  </section>
  <section>
    <h2>Agenda do dia</h2>
    <label>Data <input id="data-agenda" type="date" /></label>
    <button type="button" id="btn-agenda">Carregar</button>
    <table>
      <thead><tr><th>Sala</th><th>Título</th><th>Início</th><th>Fim</th><th>Status</th></tr></thead>
      <tbody id="agenda-body"></tbody>
    </table>
  </section>
  <script>
    const msg = document.getElementById('msg');
    function clearChildren(el) {
      while (el.firstChild) el.removeChild(el.firstChild);
    }
    function appendCell(tr, text) {
      const td = document.createElement('td');
      td.textContent = text == null ? '' : String(text);
      tr.appendChild(td);
    }
    async function loadSalas() {
      const salas = await fetch('/api/salas').then(r => r.json());
      const sel = document.getElementById('sala_id');
      clearChildren(sel);
      for (const s of salas) {
        const opt = document.createElement('option');
        opt.value = String(s.id);
        opt.textContent = `${s.nome} (${s.local})`;
        sel.appendChild(opt);
      }
    }
    function toIsoLocal(val) {
      return new Date(val).toISOString().slice(0, 19);
    }
    document.getElementById('form-reserva').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        sala_id: Number(document.getElementById('sala_id').value),
        titulo: document.getElementById('titulo').value,
        responsavel_nome: document.getElementById('responsavel_nome').value,
        responsavel_email: document.getElementById('responsavel_email').value,
        participantes: Number(document.getElementById('participantes').value),
        inicio: toIsoLocal(document.getElementById('inicio').value),
        fim: toIsoLocal(document.getElementById('fim').value),
      };
      const res = await fetch('/api/reservas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      msg.textContent = res.ok ? 'Reserva criada: ' + data.status : (data.detail || 'Erro');
    });
    document.getElementById('btn-agenda').addEventListener('click', async () => {
      const data = document.getElementById('data-agenda').value;
      const [reservas, salas] = await Promise.all([
        fetch('/api/reservas?data=' + data).then(r => r.json()),
        fetch('/api/salas').then(r => r.json()),
      ]);
      const byId = Object.fromEntries(salas.map(s => [s.id, s.nome]));
      const tbody = document.getElementById('agenda-body');
      clearChildren(tbody);
      for (const r of reservas) {
        const tr = document.createElement('tr');
        appendCell(tr, byId[r.sala_id] || r.sala_id);
        appendCell(tr, r.titulo);
        appendCell(tr, r.inicio);
        appendCell(tr, r.fim);
        appendCell(tr, r.status);
        tbody.appendChild(tr);
      }
    });
    loadSalas();
    document.getElementById('data-agenda').valueAsDate = new Date();
  </script>
</body>
</html>
